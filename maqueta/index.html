  --stone:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 38px), repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 1px, transparent 1px 96px), linear-gradient(90deg,#6f6a63,#857f76 45%,#6a655e);
  --terrazzo:radial-gradient(circle, rgba(255,232,215,.4) 0 1px, transparent 1.6px) 0 0/7px 7px, #9c4632;
  --panot:radial-gradient(circle at 50% 50%, #9b9a95 0 20%, transparent 21%) 0 0/28px 28px, radial-gradient(circle at 0 0, #9b9a95 0 26%, transparent 27%) 0 0/28px 28px, radial-gradient(circle at 100% 0, #9b9a95 0 26%, transparent 27%) 0 0/28px 28px, radial-gradient(circle at 0 100%, #9b9a95 0 26%, transparent 27%) 0 0/28px 28px, radial-gradient(circle at 100% 100%, #9b9a95 0 26%, transparent 27%) 0 0/28px 28px, repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 28px), repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 1px, transparent 1px 28px), #b4b3ae;
  --panel:rgba(22,27,33,.88);
  --f-display:"Lilita One", "Arial Black", system-ui, sans-serif;
  --f-body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.65,.05,.2,1);
  --dur:1.15s;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ============ ESCENA 3D ============ */
#viewport{position:fixed;inset:0;perspective:2000px;perspective-origin:50% 40%;overflow:hidden;cursor:grab;touch-action:none;
  background:radial-gradient(120% 80% at 50% 30%, #26303a 0%, var(--night) 70%)}
#viewport.grabbing{cursor:grabbing}
#camera,#camera2{position:absolute;left:50%;top:48%;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0;
  transition:transform var(--dur) var(--ease);will-change:transform}
#world,#world2{position:absolute;left:-600px;top:-500px;width:1200px;height:1000px;transform-style:preserve-3d}
#world *{pointer-events:none}
.box,.obj{position:absolute;transform-style:preserve-3d}
.face{position:absolute;backface-visibility:visible}
.disc{position:absolute;border-radius:50%}
.plane{position:absolute}
.glowdot{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff3d6 0 18%,rgba(255,206,130,.75) 28%,rgba(242,178,90,.25) 50%,transparent 70%)}
.cshadow{position:absolute;border-radius:50%;background:radial-gradient(closest-side, rgba(25,10,4,.5), rgba(25,10,4,.18) 55%, rgba(25,10,4,0))}
.pool{position:absolute;border-radius:50%;background:radial-gradient(closest-side, rgba(255,196,110,.42), rgba(242,178,90,.12) 60%, rgba(242,178,90,0));transform:translateZ(1px)}

.floor-in{background:
  repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 1px, transparent 1px 44px),
  repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 11px),
  linear-gradient(135deg,#7d5634,#6a4629)}
.floor-out{background:
  repeating-linear-gradient(90deg, rgba(0,0,0,.25) 0 2px, transparent 2px 60px),
  repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 60px),
  #8e8a80}
.floor-street{background:var(--panot)}
.floor-low{background:radial-gradient(140% 90% at 50% 40%, rgba(255,214,160,.08), rgba(12,4,2,.28) 100%), radial-gradient(circle, rgba(255,232,215,.4) 0 1px, transparent 1.6px) 0 0/7px 7px, radial-gradient(circle, rgba(50,12,6,.4) 0 1px, transparent 1.6px) 3px 4px/9px 9px, radial-gradient(circle, rgba(230,190,160,.3) 0 1.5px, transparent 2px) 5px 1px/13px 11px, #9c4632}
.hydraulic{background:
  radial-gradient(circle at 50% 50%, #c9b48f 0 22%, transparent 23%),
  conic-gradient(from 45deg, #2f5a4c 0 25%, #e6d9c2 0 50%, #2f5a4c 0 75%, #e6d9c2 0) ;
  background-size:36px 36px}

.zone{position:absolute;border:2px dashed transparent;border-radius:14px;transform:translateZ(3px);transition:border-color .35s, background-color .35s}
.zone.hot{border-color:rgba(242,178,90,.7);background-color:rgba(242,178,90,.07)}
.zone.current{border-color:rgba(242,178,90,.95);background-color:rgba(242,178,90,.1)}
#world .zone{pointer-events:auto;cursor:pointer}
.frown,.tear{position:absolute;transform-origin:50% 0;backface-visibility:hidden;visibility:hidden}
.frown{border-top:1.4px solid #2a1712;border-radius:50% 50% 0 0}
.tear{width:1.6px;height:2.6px;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;background:#6fc3ff;transform:translateZ(var(--z0)) rotateX(-90deg)}
.crying .crier .frown,.crying .crier .tear{visibility:visible}
.crying .crier .tear{animation:tear .9s ease-in infinite}
@keyframes tear{0%{transform:translateZ(var(--z0)) rotateX(-90deg);opacity:1}100%{transform:translateZ(calc(var(--z0) - 11px)) translateY(1px) rotateX(-90deg);opacity:0}}
.crying .crier .mover{animation:sob .22s ease-in-out infinite alternate}
@keyframes sob{from{transform:translateZ(0)}to{transform:translateZ(-1.2px) rotateX(-3deg)}}
#world2 *{pointer-events:none}
.cut-n #camera2,.inside:not(.upstairs) #camera2{visibility:hidden}   /* desde detrás o en la planta de abajo no se le vería */
.person,.mover,.legpivot,.leg{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0}
/* Sin mesa: el chico de negro se gira y se va corriendo calle abajo */
.armpivot,.swing,.raise{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0}
.raise{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.clapping .raise{transform:rotateX(172deg)}   /* brazos arriba, por encima de la cabeza */
.clapping .swing.l{animation:clapL .3s ease-in-out .35s infinite alternate}
.clapping .swing.r{animation:clapR .3s ease-in-out .35s infinite alternate}
@keyframes clapL{from{transform:rotateY(4deg)}to{transform:rotateY(19deg)}}
@keyframes clapR{from{transform:rotateY(-4deg)}to{transform:rotateY(-19deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
#confetti i{position:absolute;top:-24px;display:block;border-radius:2px;will-change:transform;animation:fall var(--t) cubic-bezier(.25,.4,.5,1) var(--d) forwards}
@keyframes fall{to{transform:translate3d(var(--x),112vh,0) rotate(var(--r))}}

.upstairs .lowfx{visibility:hidden}
/* Corte tipo casa de muñecas: la pared que queda entre la cámara y la sala se oculta (se ve mejor y hay mucho menos que pintar) */
.cut-w .wall-w,.cut-e .wall-e,.cut-n .wall-n,.cut-e .bb2{visibility:hidden}
.fx .face,.fx.plane,.fx.disc{transition:opacity .7s}
.inside .fx .face,.inside .fx.plane,.inside .fx.disc{opacity:.14}

/* Pins que siempre miran a cámara */
#grade{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 95% at 50% 45%, rgba(0,0,0,0) 55%, rgba(6,8,12,.55) 100%), linear-gradient(rgba(255,190,120,.05), rgba(255,190,120,.05))}
#pins{position:fixed;inset:0;pointer-events:none;z-index:3;transition:opacity .4s}
.arriving #pins,.scene #pins{opacity:0}
.arriving #panel{transition-delay:.85s}
.anchor{position:absolute;width:1px;height:1px}
.pin{position:absolute;left:0;top:0;will-change:transform}
.pin button{pointer-events:auto;position:absolute;left:0;bottom:44px;transform:translate(-50%,0);display:flex;align-items:center;gap:8px;white-space:nowrap;
  padding:7px 14px 7px 8px;border:1px solid rgba(242,178,90,.45);border-radius:999px;background:#1d232a;
  font:500 13px/1 var(--f-body);letter-spacing:.02em;cursor:pointer;transition:background .2s, border-color .2s, transform .2s}
.pin button::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(242,178,90,.2)}
.pin button::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:40px;background:linear-gradient(var(--amber),transparent)}
.pin button:hover,.pin.current button{border-color:var(--amber);background:#2a2217}
.pin.current button::before{animation:beat 1.6s 3}   /* late 3 veces y para: una animación infinita obligaba a recomponer toda la escena 3D en cada fotograma */
@keyframes beat{50%{box-shadow:0 0 0 9px rgba(242,178,90,0)}}
.dragging #camera,.dragging #camera2{transition:none}

/* ============ UI SUPERPUESTA ============ */
.topbar{position:fixed;top:0;left:0;right:0;background:linear-gradient(rgba(22,27,33,.85),rgba(22,27,33,0));display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 14px;pointer-events:none;z-index:5}
.topbar>*{pointer-events:auto}
.brand{font:22px/1 var(--f-display);letter-spacing:.01em}
.brand-logo{display:block;width:92px;aspect-ratio:1.57;background:var(--logo) center/86% no-repeat,#efece5;border-radius:8px}
.brand small{display:block;margin-top:4px;font:500 10px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ghost{border:1px solid var(--line);background:rgba(22,27,33,.6);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
.ghost:hover{border-color:var(--amber)}
.tag{font:500 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(242,178,90,.35);border-radius:4px;padding:5px 7px}
.top-right{display:flex;gap:10px;align-items:center}

.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;gap:4px;padding:5px;

form.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px}

<script>
(() => {
const $ = s => document.querySelector(s);
document.documentElement.lang = 'ca';
const world = $('#world'), camera = $('#camera'), camera2 = $('#camera2'), world2 = $('#world2'), vp = $('#viewport'), root = document.documentElement;

/* ---------- Constructores de geometría CSS 3D ---------- */
const shade = (c, a) => `linear-gradient(rgba(0,0,0,${a}),rgba(0,0,0,${a})), ${c}`;
/* Ensanche del local: todo lo que está a la derecha de x=500 se desplaza DX unidades; lo que cruza esa línea se estira. */
let MAP = true, OFF = 0; const MAP_T = 500, MAP_DX = 100;   // OFF: desplazamiento extra (p. ej. separar la barra de la pared)
const mapX = x => x >= MAP_T ? x + MAP_DX : x;
function mapSpan(x, w){ if (x >= MAP_T) return [x + MAP_DX, w]; if (x + w <= MAP_T) return [x, w]; return [x, w + MAP_DX]; }
function div(cls, css, parent = world){
  if (parent === world && MAP && !css._raw && css.left != null && css.width != null) {
    const L = parseFloat(css.left), W = parseFloat(css.width);
    if (/disc|pool|glowdot|anchor|cshadow/.test(cls)) css.left = (mapX(L + W/2) - W/2) + 'px';
    else { const [nx, nw] = mapSpan(L, W); css.left = nx + 'px'; css.width = nw + 'px'; }
    css.left = (parseFloat(css.left) + OFF) + 'px';
  }
  delete css._raw;
  if (parent === world && css.boxShadow) {   // sin box-shadow en la escena 3D: es lo que más cuesta repintar
    if (/glowdot/.test(cls)) { const L = parseFloat(css.left), T = parseFloat(css.top), W = parseFloat(css.width);
      Object.assign(css, {left:(L - W*1.5)+'px', top:(T - W*1.5)+'px', width:W*4+'px', height:W*4+'px', background:''}); }
    delete css.boxShadow;
  }
  const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); parent.appendChild(d); return d; }
// caja: x,y = esquina en planta; w (este-oeste), d (norte-sur), h (altura); z = elevación
function box(x, y, w, d, h, col, o = {}){
  if (MAP && !o.parent) { [x, w] = mapSpan(x, w); x += OFF; }
  const b = div('box', {_raw:true, left:x+'px', top:y+'px', width:w+'px', height:d+'px', transform:`translateZ(${o.z||0}px)`}, o.parent||world);
  const f = (css, bg) => div('face', Object.assign(css, {background:bg}), b);
  // Sombreado: cada cara lateral se oscurece hacia el suelo (oclusión ambiental) y la parte de arriba recibe un poco de luz cálida
  const ao = h >= 14 && !o.noshade;
  const AO = dir => ao ? `linear-gradient(${dir}, rgba(18,8,4,.34), rgba(18,8,4,.08) 35%, rgba(255,226,180,.06) 85%), ` : '';
  const sh = (c, a, dir) => o.noshade ? c : AO(dir) + shade(c, a);
  const topLit = t => (o.noshade || t === 'transparent') ? t : `radial-gradient(120% 120% at 35% 25%, rgba(255,236,205,.10), rgba(0,0,0,.06)), ${t}`;
  const F = o.faces || ((w <= 30 && d <= 30 && !o.parent) ? 'tsw' : 'tsnwe');   // las piezas de personajes animados llevan todas las caras: al girar no se ven huecas   // en objetos pequeños bastan dos lados + tapa (menos piezas que pintar)   // caras a dibujar (t arriba, s/n/w/e lados). Las caras se ven por ambos lados, así que a un objeto fino le bastan dos.
  if (F.includes('t') && o.top !== 'transparent') f({left:0,top:0,width:w+'px',height:d+'px',transform:`translateZ(${h}px)`, borderRadius:o.r||0}, topLit(o.top || col));

  });
  const hz = L + T;

}

let clapT;
// Carrera del chico de negro, calculada en cada fotograma según el tiempo transcurrido (en móviles, las animaciones CSS
// anidadas en 3D se paraban o daban saltos; así siempre avanza a la velocidad correcta aunque se pierda algún fotograma)
let runRAF = 0;
const runnerEl = $('#world2 .runner');
const runParts = () => ({ mover: runnerEl.querySelector('.mover'), legs: [...runnerEl.querySelectorAll('.leg')], arms: [...runnerEl.querySelectorAll('.raise')] });
function startRun(){
  cancelAnimationFrame(runRAF);
  const P = runParts(), t0 = performance.now(), T = 3600;
  P.arms.forEach(a => a.style.transition = 'none');
  runnerEl.style.visibility = 'visible';
  const ease = k => k * k * (3 - 2 * k);
  (function step(now){
    const p = Math.min(1, (now - t0) / T);
    let x = 0, y = 0, r = 0;
    if (p < .10) r = -90 * ease(p / .10);                                     // se gira hacia la calle
    else if (p < .72) { r = -90; x = 550 * (p - .10) / .62; }                // corre calle abajo
    else if (p < .80) { r = -90 - 90 * ease((p - .72) / .08); x = 550; }     // se gira hacia la puerta del Bar Bocata 2
    else { r = -180; x = 550; y = -48 * (p - .80) / .20; }                   // entra
    P.mover.style.transform = `translate3d(${x}px, ${y}px, ${p > .1 && p < .97 ? Math.abs(Math.sin((now - t0) / 1000 * Math.PI * 5)) * 2 : 0}px) rotateZ(${r}deg)`;
    const sw = p > .06 && p < .97 ? Math.sin((now - t0) / 1000 * Math.PI * 5) * 38 : 0;
    P.legs[0].style.transform = `rotateX(${sw}deg)`; P.legs[1].style.transform = `rotateX(${-sw}deg)`;
    P.arms[0].style.transform = `rotateX(${-sw}deg)`; P.arms[1].style.transform = `rotateX(${sw}deg)`;
    if (p >= .97) { runnerEl.style.visibility = 'hidden'; return; }         // ya ha entrado por la puerta
    runRAF = requestAnimationFrame(step);
  })(t0);
}
function resetRun(){
  cancelAnimationFrame(runRAF);
  const P = runParts();
  [P.mover, ...P.legs, ...P.arms].forEach(el => { el.style.transform = ''; });
  P.arms.forEach(a => a.style.transition = '');
  runnerEl.style.visibility = '';
}

    <label>Zona<select id="rZone"><option ${down?'':'selected'}>Planta carrer</option><option ${down?'selected':''}>Sala de baix</option></select></label>
    <button class="cta full" type="submit">Sol·licita la reserva</button>
    <p class="note full">Prototip: aquí es connectaria el motor de reserves del restaurant.</p></form>`;
  $('#resForm').addEventListener('submit', e => {
    e.preventDefault();
    const t = $('#rTime').value;
    if (FULL.includes(t)) {                     // no queda mesa: aviso y el chico de la puerta se va corriendo
      let ko = $('#resForm .ko'); if (!ko) { ko = document.createElement('div'); ko.className = 'ko full'; $('#resForm button[type=submit]').before(ko); }
      ko.innerHTML = `Ho sentim, a les <b>${t}</b> no queda cap taula lliure al Bar Bocata. Prova una altra hora o passa pel Bar Bocata 2, aquí al costat.`;
      runAway(); return;
    }
    celebrate();
    const d = new Date($('#rDate').value+'T12:00').toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long'});
    e.target.innerHTML = `<div class="ok">Taula per a <b>${$('#rPax').value}</b> a la <b>${$('#rZone').value.toLowerCase()}</b>, ${d} a les <b>${$('#rTime').value}</b>. <br><span class="note">A la versió real, aquí arribaria la confirmació.</span></div>`;
  });
}

/* ---------- Interacción: clic, arrastre, zoom, teclado ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]'); if (t && t.dataset.go) { if (!movedFar) go(t.dataset.go); return; }
});
let drag = null, movedFar = false, pinch = null, rafPending = false;
const pointers = new Map();
const schedule = () => { if (!rafPending) { rafPending = true; requestAnimationFrame(() => { rafPending = false; apply(); }); } };
const clampS = v => Math.max(fit()*.5, Math.min(fit()*3.2, v));
vp.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  try { vp.setPointerCapture(e.pointerId); } catch (_) {}
  if (pointers.size === 2) {               // dos dedos: zoom con pellizco
    const [p1, p2] = [...pointers.values()];
    pinch = {d: Math.hypot(p1.x-p2.x, p1.y-p2.y) || 1, s: cam.s}; drag = null; movedFar = true;
    document.body.classList.add('dragging');
  } else if (pointers.size === 1) {
    drag = {x:e.clientX, y:e.clientY, rz:cam.rz, rx:cam.rx}; movedFar = false;
  }
});
vp.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && pointers.size >= 2) {
    const [p1, p2] = [...pointers.values()];
    cam.s = clampS(pinch.s * Math.hypot(p1.x-p2.x, p1.y-p2.y) / pinch.d); schedule(); return;
  }
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!movedFar && Math.hypot(dx,dy) > 6){ movedFar = true; document.body.classList.add('dragging'); vp.classList.add('grabbing'); }
  if (!movedFar) return;
  cam.rz = drag.rz - dx * .25; cam.rx = Math.max(22, Math.min(78, drag.rx - dy * .2)); schedule();
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size < 2) { pinch = null; drag = null; document.body.classList.remove('dragging'); setTimeout(() => movedFar = false, 0); } return; }
  const wasDrag = movedFar; drag = null;
  document.body.classList.remove('dragging'); vp.classList.remove('grabbing');
  if (!wasDrag && e.type === 'pointerup') {   // clic sin arrastre sobre una zona del suelo
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const z = hit && hit.closest && hit.closest('.zone'); if (z) go(z.dataset.zone);
  }
  setTimeout(() => movedFar = false, 0);
}
['pointerup','pointercancel','lostpointercapture'].forEach(t => vp.addEventListener(t, endPointer));
vp.addEventListener('wheel', e => {
  e.preventDefault();
  document.body.classList.add('dragging');
  cam.s = clampS(cam.s * Math.exp(-e.deltaY * .0015)); schedule();
  clearTimeout(vp._t); vp._t = setTimeout(() => document.body.classList.remove('dragging'), 140);
}, {passive:false});
addEventListener('keydown', e => {
  if ($('#facade').hidden === false || /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  const i = ORDER.indexOf(current);
  if (e.key === 'Escape') go('overview');
  if (e.key === 'ArrowRight') go(ORDER[Math.min(ORDER.length-1, i+1)] || 'entrada');
  if (e.key === 'ArrowLeft') go(i <= 0 ? 'overview' : ORDER[i-1]);
});
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { cam.s = ZONES[current].cam.z * fit(); apply(); }, 150); });

/* ---------- Fachada → interior ---------- */
const facade = $('#facade');
const entryTimers = [];
function enter(){
  if (facade.classList.contains('opening')) return;
  facade.classList.add('opening');
  // cámara arranca "en la calle", muy baja y lejos, sin transición
  document.body.classList.add('dragging');
  Object.assign(cam, {x:576, y:1010, rx:82, rz:0, h:0, s:fit()*3.4}); apply();
  // Secuencia de entrada escalonada: la fachada se acerca y se desvanece, la cámara vuela al interior
  // y el panel entra cuando la cámara ya casi ha llegado (antes todo arrancaba a la vez y el móvil se atascaba)
  document.body.classList.add('arriving');
  entryTimers.push(setTimeout(() => {
    facade.classList.add('entering');
    requestAnimationFrame(() => requestAnimationFrame(() => { document.body.classList.remove('dragging'); go('entrada'); }));
    entryTimers.push(setTimeout(() => { facade.hidden = true; setInert(false); }, 950));
    entryTimers.push(setTimeout(() => { document.body.classList.remove('arriving'); kick(600); }, 1700));
  }, 650));
}
function toStreet(){
  entryTimers.splice(0).forEach(clearTimeout);
  seqT.splice(0).forEach(clearTimeout);
  document.body.classList.remove('arriving', 'dragging', 'runaway', 'clapping', 'crying', 'scene'); resetRun();
  closePanel();
  facade.hidden = false; setInert(true);
  requestAnimationFrame(() => requestAnimationFrame(() => facade.classList.remove('entering','opening')));
  go('overview');
}
const setInert = on => ['#viewport','#pins','.dock','.topbar','#panel'].forEach(q => { const el = $(q); if (el) el.inert = on; });
setInert(!facade.hidden);
$('#enter').addEventListener('click', enter);
$('#door').addEventListener('click', enter);
$('#toStreet').addEventListener('click', toStreet);

// Los marcadores siguen a la cámara solo mientras se mueve (antes se recalculaban en cada frame aunque todo estuviera quieto)
let trackUntil = 0, tracking = false;
function track(){
  ORDER.forEach(n => { const r = pinEls[n]._a.getBoundingClientRect(); pinEls[n].style.transform = `translate3d(${r.left}px,${r.top}px,0)`; });
  if (performance.now() < trackUntil || pointers.size) requestAnimationFrame(track); else tracking = false;
}
function kick(ms){ trackUntil = Math.max(trackUntil, performance.now() + ms); if (!tracking) { tracking = true; requestAnimationFrame(track); } }
go('overview', {silent:true});
})();
</script>

<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CE112D">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Panell Bar Bocata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: app shell in Bar Bocata red; desktop = side menu + content, phone = content + bottom tab bar; single deliberate light look */
:root{
  color-scheme:light;
  --ground:#F2EFEB; --paper:#FFFFFF; --ink:#1E1A1A; --ink2:#3A3431; --muted:#5E5752; --line:#DDD6CF; --line2:#EEE9E3;
  --red:#CE112D; --red-ink:#8E0A1E; --red-soft:#FDF3F5; --red-line:#F1C2CA;
  --ok:#2A7A4A; --ok-soft:#E2F2E8; --warn:#BF410D; --warn-soft:#FCEDE6; --blue:#1F4F8F; --blue-soft:#E6EEF8; --amber:#7A4B00; --amber-soft:#FFF1D6;
  --bubble:#DCF2D6; --chat:#ECE8E3;
  --f:"Archivo","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card{position:relative}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,3.4vw,2.4rem);font-weight:850;font-stretch:72%;line-height:1}
h2{font-size:1.12rem;font-weight:750}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:24px;width:auto;display:block}
.brand span{font-size:.88rem;font-weight:600;color:var(--muted)}
.top-r{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:flex;gap:2px;padding:3px;background:var(--ground);border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:0 14px;min-height:38px;font-weight:700;font-size:.9rem;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.who{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600}
.who i{font-style:normal;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:800}
@media (max-width:620px){.who{display:none}.brand span{display:none}.top-in{padding:10px 16px}}

/* Shell */
.app{max-width:1440px;margin:0 auto;padding:20px;display:flex;gap:24px;align-items:flex-start}
.side{flex:0 0 228px;position:sticky;top:76px;display:flex;flex-direction:column;gap:3px}
.navi{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border:0;border-radius:10px;background:transparent;text-align:left;font-weight:600;color:var(--ink2)}
.navi svg{flex:none}
.navi span.l{flex:1}
.navi[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line),inset 3px 0 0 var(--red)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:.75rem;font-weight:800;display:inline-grid;place-items:center}
.badge[hidden]{display:none}
.side hr{border:0;height:1px;background:var(--line);margin:8px 4px}
.side .foot{padding:12px;font-size:.8rem;color:var(--muted);display:grid;gap:8px}
.linkb{border:0;background:none;padding:0;color:var(--red-ink);font-weight:700;text-decoration:underline;text-underline-offset:2px;font-size:.82rem;text-align:left}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}
@media (max-width:860px){
  .app{padding:16px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .side{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
  .tabbar button[aria-current="page"]{color:var(--red);font-weight:800}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:.66rem}
}

/* Building blocks */
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px}
.pad{padding:18px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;width:100%}
button.kpi{cursor:pointer}
.kpi small{font-size:.8rem;font-weight:700;color:var(--muted)}
.kpi b{font-size:2.3rem;font-weight:850;font-stretch:72%;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:.82rem;color:var(--muted)}
.kpi.alert{background:var(--red);border-color:var(--red);color:#fff}
.kpi.alert small,.kpi.alert span{color:#fff}
.btn{border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:700;padding:0 18px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.sec{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-red{background:#FDE4E8;color:var(--red-ink)}.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-amber{background:var(--amber-soft);color:var(--amber)}.p-grey{background:var(--ground);color:var(--muted)}.p-warn{background:var(--warn-soft);color:#8A2E07}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 13px;min-height:38px;font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{display:grid;gap:5px}
.field label{font-weight:700;font-size:.85rem}
.inp{min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--paper);width:100%}
textarea.inp{padding:10px 12px;min-height:80px;resize:vertical}
.err{color:var(--red-ink);font-size:.82rem;font-weight:600}
.empty{padding:26px 18px;text-align:center;color:var(--muted)}

/* Press feedback; hover only with a mouse */
.btn,.chip,.navi,.seg button,.tabbar button,.kpi,.conv,.sw,.tl{transition:transform 160ms var(--ease),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.btn:not(:disabled):active,.chip:active,.navi:active,.seg button:active,.tabbar button:active,button.kpi:active,.conv:active,.sw:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){
  .navi:not([aria-current="page"]):hover{background:#EAE4DD}
  .btn:not(.sec):not(:disabled):hover{background:var(--red-ink)}
  .btn.dark:hover{background:#000}
  .btn.sec:hover,.chip:not([aria-pressed="true"]):hover{border-color:var(--muted)}
  .conv:hover{background:#FAF8F5}
  button.kpi:not(.alert):hover{border-color:var(--muted)}
}

/* Avui */
.need{border:1px solid var(--red-line);background:var(--red-soft);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.need .t{min-width:0;flex:1 1 220px}
.need .r{color:var(--red-ink);font-weight:600;font-size:.9rem}
.need .q{color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.rl:last-child{border-bottom:0}

/* Conversations */
.inbox{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.list{flex:1 1 300px;max-width:400px;min-width:0;overflow:hidden}
.conv{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line2);padding:13px 16px;background:var(--paper)}
.conv[aria-current="true"]{background:var(--red-soft);box-shadow:inset 4px 0 0 var(--red)}
.conv .q{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{flex:999 1 380px;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.th-h{padding:14px 18px;border-bottom:1px solid var(--line)}
.banner{margin:14px 18px 0;padding:12px 14px;border-radius:12px;background:var(--red-soft);border:1px solid var(--red-line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.banner span{color:var(--red-ink);font-weight:600;flex:1 1 220px}
.msgs{background:var(--chat);margin:14px 18px;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:240px;max-height:440px;overflow-y:auto}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:.92rem;line-height:1.4;background:var(--paper);align-self:flex-start;border-bottom-left-radius:4px}
.msg small{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.msg.b{background:var(--bubble);align-self:flex-end;border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.msg.h{background:var(--blue-soft);align-self:flex-end;border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.msg.s{align-self:center;background:var(--ink);color:#fff;font-size:.76rem;font-weight:700;border-radius:999px;padding:5px 12px}
.msg.new{animation:msgin 220ms var(--ease)}
@keyframes msgin{from{opacity:0;transform:translateY(6px)}}
.compose{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 18px}
.compose .inp{flex:1 1 220px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}

/* Reservations */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:.92rem}
th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line)}
td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.h{font-weight:800;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* Carta */
.carta-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.carta-list{flex:999 1 460px;min-width:0;display:flex;flex-direction:column;gap:14px}
.dish{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 18px;border-bottom:1px solid var(--line2)}
.dish:last-child{border-bottom:0}
.dish .n{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:3px}
.dish .n b.off{color:#8C847D;text-decoration:line-through}
.alg{font-size:.68rem;font-weight:800;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.price{display:flex;align-items:center;gap:4px}
.price input{width:84px;min-height:40px;border:1px solid var(--line);border-radius:10px;padding:0 8px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums;background:var(--paper)}
.tl{border:1px solid var(--line);border-radius:999px;background:var(--paper);font-weight:700;font-size:.85rem;padding:0 12px;min-height:40px;white-space:nowrap}
.tl[aria-pressed="true"].sold{background:var(--warn);border-color:var(--warn);color:#fff}
.tl[aria-pressed="true"].star{background:var(--ink);border-color:var(--ink);color:#fff}
.preview{flex:1 1 320px;max-width:360px;position:sticky;top:76px}
.phone{background:#1B1717;border-radius:34px;padding:10px;box-shadow:0 26px 50px -30px rgba(30,26,26,.6)}
.screen{border-radius:24px;overflow:hidden;background:var(--paper);height:600px;display:flex;flex-direction:column}
.ph-h{background:var(--red);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.ph-h b{font-size:.95rem}
.langs{display:flex;gap:3px}
.langs button{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:999px;padding:2px 8px;font-size:.7rem;font-weight:700}
.langs button[aria-pressed="true"]{background:#fff;color:var(--red)}
.menu{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.menu h3{font-size:1.05rem;font-weight:800;font-stretch:75%;margin-top:6px}
.mi{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:7px}
.mi i{width:48px;height:38px;border-radius:8px;background:var(--c)}
.mi b{font-size:.86rem;display:block;line-height:1.25}
.mi em{font-style:normal;font-size:.7rem;font-weight:800;color:#fff;background:var(--ink);border-radius:999px;padding:1px 7px;display:inline-block;margin-top:3px}
.mi .pr{font-weight:800;font-size:.86rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.mi.off{opacity:.45}
.mi.off .pr{font-size:.72rem;color:var(--warn)}
.mi.flash{animation:flash 700ms var(--ease)}
@keyframes flash{from{background:var(--amber-soft)}}
@media (max-width:860px){.preview{position:static;max-width:none}.screen{height:520px}}

/* Assistant */
.sw{flex:none;width:52px;height:30px;border-radius:999px;border:0;padding:3px;display:flex;align-items:center;background:#CFC6BC;justify-content:flex-start}
.sw[aria-checked="true"]{background:var(--ok);justify-content:flex-end}
.sw i{width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);display:block}
.set{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2)}
.set:last-child{border-bottom:0}
.tester .msgs{margin:0;min-height:200px;max-height:300px}

/* Later */
.later{background:var(--paper);border:1px dashed #CFC6BC;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}

/* Modal + toast */
.ov{position:fixed;inset:0;z-index:40;background:rgba(30,26,26,.45);display:grid;place-items:center;padding:16px;animation:fade 180ms ease}
.ov[hidden]{display:none}
.modal{background:var(--paper);border-radius:20px;padding:22px;width:min(520px,100%);max-height:90vh;overflow-y:auto;display:grid;gap:14px;animation:pop 220ms var(--ease)}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.form2{grid-template-columns:1fr}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.toast{position:fixed;left:16px;right:16px;margin-inline:auto;width:fit-content;max-width:520px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:#fff;font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center;animation:toast 220ms var(--ease)}
.toast[hidden]{display:none}
@keyframes toast{from{opacity:0;transform:translateY(8px)}}
@media (max-width:860px){.toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>

    var dd=dishById(S.dish);
    if(dd&&!S.sold[dd.id]) h+='<div class="mi" data-dish="'+dd.id+'" style="border-color:var(--ink)"><i style="--c:'+dd.c+'"></i><span><b>'+esc(dd.n[L])+'</b><em>'+T[L].day+'</em></span><span class="pr">'+eur(priceOf(dd))+'</span></div>';
    CARTA.forEach(function(s){
      h+='<h3>'+esc(s.sec[L])+'</h3>';
      s.items.forEach(function(d){ var sold=!!S.sold[d.id];
        h+='<div class="mi'+(sold?' off':'')+'" data-dish="'+d.id+'"><i style="--c:'+d.c+'"></i><span><b>'+esc(d.n[L])+'</b><span class="chips" style="gap:3px;margin-top:2px">'+d.alg.map(function(a){return '<span class="alg">'+a+'</span>';}).join('')+'</span></span><span class="pr">'+(sold?T[L].sold:eur(priceOf(d)))+'</span></div>';
      });
    });
    return h;
  }
  function refreshMenu(id){ var m=$('menu'); if(!m) return; m.innerHTML=menuHTML(); if(id){ [].forEach.call(m.querySelectorAll('[data-dish="'+id+'"]'),function(e){e.classList.add('flash');}); } }

  var RULES=[['grups','Grups de més de 8 persones','Les reserves grans les confirma una persona.'],['alerg','Al·lèrgies que no són a la fitxa','Si la fitxa no ho diu, no respon: us ho passa.'],['queixes','Queixes i clients molestos','Una persona respon sempre a les queixes.'],['canvis','Canvis en un plat','Treure o canviar ingredients ho confirma cuina.'],['fora','Tot el que arribi fora d’horari','De nit només pren nota i respon l’endemà.']];
  function vAsis(){
    var h='<h1>Assistent</h1><p class="muted" style="max-width:62ch">Aquí decidiu quan us passa la conversa i què sap. Proveu-lo a la dreta: les respostes canvien segons el que configureu i segons la carta.</p>';
    h+='<div class="grid2"><div class="stack"><section class="card pad"><h2 style="margin-bottom:6px">Quan us passa la conversa</h2>'+RULES.map(function(r){var on=!!S.cfg[r[0]];return '<div class="set"><div style="min-width:0"><b>'+r[1]+'</b><div class="muted" style="font-size:.86rem">'+r[2]+'</div></div><button class="sw" type="button" role="switch" aria-checked="'+on+'" aria-label="'+r[1]+'" data-act="cfg" data-k="'+r[0]+'"><i></i></button></div>';}).join('')+'</section>'+
      '<section class="card pad stack"><h2>Què sap l’assistent</h2>'+
      '<div class="field"><label for="h-tra">Horari de Travessera</label><textarea class="inp" id="h-tra" data-in="h-tra">'+esc(S.horaris.tra)+'</textarea></div>'+
      '<div class="field"><label for="h-dia">Horari de Diagonal</label><textarea class="inp" id="h-dia" data-in="h-dia">'+esc(S.horaris.dia)+'</textarea></div>'+
      '<div class="field"><label for="normes">Normes de reserva</label><textarea class="inp" id="normes" data-in="normes">'+esc(S.normes)+'</textarea></div>'+
      '<div class="set"><div><b>Carta i preus</b><div class="muted" style="font-size:.86rem">Es llegeix de la carta QR, sempre al dia.</div></div><span class="pill p-ok">Connectada</span></div>'+
      '<div class="set"><div><b>Fitxes d’al·lèrgens</b><div class="muted" style="font-size:.86rem">Una per plat, validada per cuina.</div></div><span class="pill p-red">Pendent</span></div>'+
      '<p class="muted" style="font-size:.85rem">Es desa automàticament.</p></section></div>';
    h+='<section class="card pad stack tester"><div class="row"><h2>Prova l’assistent</h2><button class="btn sec sm" type="button" data-act="clearTest">Esborrar</button></div>'+
      '<div class="chips">'+['Quin horari teniu?','Puc venir amb el gos?','Teniu macarrons avui?','Som 12 per dinar divendres','La meva filla és al·lèrgica a les nous'].map(function(t){return '<button class="chip" type="button" data-act="ask" data-t="'+esc(t)+'">'+esc(t)+'</button>';}).join('')+'</div>'+
      '<div class="msgs" id="tmsgs">'+(S.test.length?S.test.map(function(m){return '<div class="msg '+(m[0]==='c'?'':m[0])+(m[2]?' new':'')+'">'+(m[0]==='s'?'':'<small>'+(m[0]==='c'?'Client':'Assistent')+'</small>')+esc(m[1])+'</div>';}).join(''):'<p class="muted" style="margin:auto;text-align:center">Escriu una pregunta com si fossis un client.</p>')+'</div>'+
      '<form class="compose" data-form="ask" style="padding:0"><label class="sr" for="tq">Pregunta de prova</label><input class="inp" id="tq" placeholder="Escriu com un client…" autocomplete="off"><button class="btn" type="submit">Preguntar</button></form></section></div>';
    h+='<section class="card pad row"><div><h2>Avisos al mòbil</h2><span class="muted">Quan una conversa necessita una persona, l’encarregat de cada local rep un avís per WhatsApp al [NÚMERO].</span></div><span class="pill p-ok">Actiu</span></section>';
    return h;
  }
  function answer(q){
    var t=q.toLowerCase(), esc8=function(r){return S.cfg[r];};
    var out=[];
    var num=(t.match(/\d+/)||[])[0];
    if(/al·l|alerg|al.lerg|celíac|celiac|gluten|nous|fruits secs|intoler/.test(t)){
      if(esc8('alerg')) return [['b','Ho consulto amb l’equip perquè ho confirmin amb cuina. Et responen de seguida.'],['s','Passa a una persona: al·lèrgia']];
      return [['b','Segons les nostres fitxes, la mousse de xocolata porta avellanes. Per a qualsevol altra al·lèrgia, avisa-ho a la reserva.']];
    }
    if(/queixa|fatal|vergonya|molt malament|horrible/.test(t)){
      if(esc8('queixes')) return [['b','Sentim molt el que ens expliques. Ho passo a l’encarregat perquè t’escrigui personalment.'],['s','Passa a una persona: queixa']];
      return [['b','Sentim molt el que ens expliques. Ho tindrem en compte.']];
    }
    if((/som|grup|persones|pers\b/.test(t))&&num&&+num>8){
      if(esc8('grups')) return [['b','Per a grups de més de 8 persones ho confirma l’equip. Els aviso ara i et responen aviat.'],['s','Passa a una persona: grup de '+num]];
      return [['b','Tenim lloc per a '+num+' persones. Vols que et passi el menú de grup?']];
    }
    if(/sense |treure|canviar|sin /.test(t)&&esc8('canvis')) return [['b','Els canvis en un plat els confirma cuina. Ho passo a l’equip.'],['s','Passa a una persona: canvi en un plat']];
    var words=t.split(/[^a-zà-ÿ·]+/);var found=DISHES.filter(function(d){var w=d.n.ca.toLowerCase().split(/[ ,]/)[0];return words.indexOf(w)>-1;})[0];
    if(found){
      if(S.sold[found.id]) return [['b','Avui ens hem quedat sense '+found.n.ca.toLowerCase()+', ho sentim. Et recomanem el plat del dia: '+dishById(S.dish).n.ca.toLowerCase()+'.']];
      return [['b','Sí, avui tenim '+found.n.ca.toLowerCase()+' ('+eur(priceOf(found))+').']];
    }
    if(/plat del dia|recomana/.test(t)) return [['b','Avui el plat del dia és '+dishById(S.dish).n.ca.toLowerCase()+'.']];
    if(/horari|obriu|tanqueu|hora |obert/.test(t)) return [['b','Travessera: '+S.horaris.tra+' Diagonal: '+S.horaris.dia]];
    if(/gos|mascot|terrassa|trona/.test(t)) return [['b',S.normes]];
    if(/taula|reserv/.test(t)) return [['b','I tant! Per a quantes persones, quin dia i a quina hora? I a Travessera o a Diagonal?']];
    return [['b','No ho sé del cert, així que ho passo a l’equip perquè et responguin.'],['s','Passa a una persona: no té la resposta']];
  }

  function vProx(){
    var L=[['Albarans i factures','Una foto i els preus es guarden sols, amb avisos quan un proveïdor apuja alguna cosa.'],['Escandalls','El marge de cada plat, recalculat amb cada factura.'],['Ressenyes','Respostes proposades per a Google i TripAdvisor, llestes per aprovar.'],['Torns','Previsió de clients per franja i per local per quadrar l’equip.']];
    return '<h1>Pròximament</h1><p class="muted" style="max-width:62ch">Aquests mòduls s’afegiran a aquest mateix panell quan decidiu activar-los. No caldrà aprendre res de nou.</p><div class="kpis">'+L.map(function(l){return '<div class="later"><span class="muted" style="font-size:.8rem;font-weight:700">Fase 2</span><b style="font-size:1.1rem">'+l[0]+'</b><span class="muted">'+l[1]+'</span></div>';}).join('')+'</div>';
  }

  /* ---------- Render ---------- */
  var V={avui:vAvui,conv:vConv,res:vRes,carta:vCarta,asis:vAsis,prox:vProx};
  function render(focus){
    var main=$('view'); main.innerHTML=V[S.view]();
    [].forEach.call(document.querySelectorAll('[data-view]'),function(b){ if(b.closest('#side,#tabbar')) b.setAttribute('aria-current',b.dataset.view===S.view?'page':'false'); });
    [].forEach.call(document.querySelectorAll('#seg button'),function(b){b.setAttribute('aria-pressed',b.dataset.loc===S.local);});
    var n=needCount(); [].forEach.call(document.querySelectorAll('[data-badge]'),function(b){b.textContent=n;b.hidden=!n;});
    var m=$('msgs'); if(m) m.scrollTop=m.scrollHeight; var tm=$('tmsgs'); if(tm) tm.scrollTop=tm.scrollHeight;
    S.convs.forEach(function(c){c.msgs.forEach(function(x){x[2]=0;});}); S.test.forEach(function(x){x[2]=0;});
    if(focus&&$(focus)){ var el=$(focus); el.focus(); if(el.setSelectionRange&&el.value) el.setSelectionRange(el.value.length,el.value.length); }
    save();
  }
  function go(v){ S.view=v; render(); window.scrollTo(0,0); try{history.replaceState(null,'','#'+v);}catch(e){} }
  var curConv=function(){return S.convs.filter(function(c){return c.id===S.conv;})[0];};

  /* ---------- Events ---------- */
  document.addEventListener('click',function(e){
    var v=e.target.closest('[data-view]'); if(v&&!e.target.closest('[data-act]')){ go(v.dataset.view); return; }
    var l=e.target.closest('[data-loc]'); if(l){ S.local=l.dataset.loc; render(); return; }
    var a=e.target.closest('[data-act]'); if(!a) return;
    var act=a.dataset.act, c;
    switch(act){
      case 'openConv': S.conv=a.dataset.id; S.view='conv'; render(); if(window.innerWidth<860){var t=document.querySelector('.thread'); if(t) t.scrollIntoView({block:'start'});} break;
      case 'filterNeed': S.filter='persona'; S.conv=(S.convs.filter(function(x){return inLoc(x)&&x.status==='persona';})[0]||{}).id||S.conv; go('conv'); break;
      case 'filter': S.filter=a.dataset.f; render(); break;
      case 'take': c=curConv(); c.status='equip'; c.msgs.push(['s','Ho porta l’equip des de '+now(),1]); render('draft'); toast('Ara la conversa la porteu vosaltres'); break;
      case 'release': c=curConv(); c.status='assistent'; c.msgs.push(['s','Tornada a l’assistent',1]); render(); toast('L’assistent torna a respondre'); break;
      case 'resolve': c=curConv(); c.status='resolta'; c.msgs.push(['s','Marcada com a resolta',1]); render(); toast('Conversa resolta'); break;
      case 'quick': $('draft').value=a.dataset.t; $('draft').focus(); break;
      case 'simulate': simulate(); break;
      case 'day': S.day=a.dataset.d; render(); break;
      case 'setEst': var r=S.res.filter(function(x){return x.id===a.dataset.id;})[0]; r.estat=a.dataset.e; render(); toast(r.name+': '+r.estat.toLowerCase()); break;
      case 'newRes': openModal(); break;
      case 'closeModal': $('ov').hidden=true; break;
      case 'sold': S.sold[a.dataset.id]=!S.sold[a.dataset.id]; var d=dishById(a.dataset.id); render(); refreshMenu(a.dataset.id); toast(d.n.ca+(S.sold[d.id]?': esgotat a la carta':': torna a estar disponible')); break;
      case 'star': S.dish=a.dataset.id; render(); refreshMenu(a.dataset.id); toast('Plat del dia: '+dishById(S.dish).n.ca); break;
      case 'lang': S.lang=a.dataset.l; render(); break;
      case 'cfg': S.cfg[a.dataset.k]=!S.cfg[a.dataset.k]; render(); break;
      case 'ask': askTest(a.dataset.t); break;
      case 'clearTest': S.test=[]; render(); break;
      case 'reset': var keepView=S.view; S=seed(); S.view=keepView; render(); toast('Dades d’exemple restablertes'); break;
    }
  });
  document.addEventListener('submit',function(e){
    var f=e.target; if(f.id==='resForm'){ e.preventDefault(); addRes(); return; }
    var k=f.dataset.form; if(!k) return; e.preventDefault();
    if(k==='send'){ var t=$('draft').value.trim(); if(!t){$('draft').focus();return;} var c=curConv(); c.msgs.push(['h',t,1]); c.time=now(); render('draft'); toast('Missatge enviat'); }
    if(k==='ask'){ var q=$('tq').value.trim(); if(!q){$('tq').focus();return;} askTest(q,true); }
  });
  document.addEventListener('input',function(e){
    var k=e.target.dataset.in;
    if(k==='q'){ S.q=e.target.value; render('q'); }
    if(k==='rq'){ S.rq=e.target.value; render('rq'); }
    if(k==='h-tra'){ S.horaris.tra=e.target.value; save(); }
    if(k==='h-dia'){ S.horaris.dia=e.target.value; save(); }
    if(k==='normes'){ S.normes=e.target.value; save(); }
  });
  document.addEventListener('change',function(e){
    var id=e.target.dataset.price; if(!id) return;
    var v=parseFloat(String(e.target.value).replace(',','.'));
    if(isNaN(v)||v<=0){ e.target.value=priceOf(dishById(id)).toFixed(2).replace('.',','); toast('Escriu un preu vàlid, per exemple 6,50'); return; }
    S.prices[id]=Math.round(v*100)/100; e.target.value=S.prices[id].toFixed(2).replace('.',','); save(); refreshMenu(id); toast('Preu actualitzat a la carta: '+eur(S.prices[id]));
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('ov').hidden){$('ov').hidden=true;} });
  $('ov').addEventListener('click',function(e){ if(e.target===$('ov')) $('ov').hidden=true; });

  function askTest(q,fromInput){
    S.test.push(['c',q,1]); answer(q).forEach(function(m){S.test.push([m[0],m[1],1]);});
    render(fromInput?'tq':null);
  }
  var SIMS=[
    {local:'dia',name:'Núria C.',kind:'Al·lèrgens',text:'Hola! Teniu alguna opció sense gluten per sopar avui?',rule:'alerg',reason:'Al·lèrgia que no és a la fitxa',reply:'Hola, Núria! Ho consulto amb cuina perquè t’ho confirmin. Et responen de seguida.'},
    {local:'tra',name:'Pere V.',kind:'Reserva',text:'Teniu taula per a 2 avui a les 14:30?',rule:null,reply:'Hola, Pere! Sí: et puc donar taula a les 14:30 a dins. Te la reservo?'},
    {local:'tra',name:'Carla M.',kind:'Queixa',text:'Ahir vam esperar 40 minuts per menjar, no és normal',rule:'queixes',reason:'Queixa d’un client',reply:'Sentim molt l’espera, Carla. Ho passo a l’encarregat perquè t’escrigui personalment.'}
  ];
  var simI=0;
  function simulate(){
    var s=SIMS[simI%SIMS.length]; simI++;
    var esc8=s.rule&&S.cfg[s.rule];
    var c={id:'c'+(++S.seq),local:S.local==='tots'?s.local:S.local,name:s.name,phone:'+34 6•• ••• '+(100+S.seq*7%900),time:now(),kind:s.kind,status:esc8?'persona':'assistent',reason:s.reason||'',msgs:[['c',s.text,1],['b',s.reply,1]]};
    if(esc8) c.msgs.push(['s','Passa a una persona: '+s.reason.toLowerCase(),1]);
    S.convs.unshift(c); S.conv=c.id; S.filter='totes'; render();
    toast(esc8?'Missatge nou de '+s.name+': necessita una persona':'Missatge nou de '+s.name+': l’assistent ja respon');
  }
  function openModal(){
    var sel=$('f-h'); sel.innerHTML='';
    ['13:00','13:15','13:30','13:45','14:00','14:15','14:30','14:45','15:00','20:30','21:00','21:30','22:00','22:30'].forEach(function(h){var o=document.createElement('option');o.textContent=h;sel.appendChild(o);});
    $('f-name').value='';$('f-n').value='';$('f-pax').value='2';$('f-day').value=S.day;$('f-loc').value=S.local==='tots'?'tra':S.local;$('f-err').hidden=true;
    $('ov').hidden=false; $('f-name').focus();
  }
  function addRes(){
    var name=$('f-name').value.trim(), pax=parseInt($('f-pax').value,10), err=$('f-err');
    if(!name){err.textContent='Escriu el nom de la reserva.';err.hidden=false;$('f-name').focus();return;}
    if(!pax||pax<1||pax>30){err.textContent='El nombre de persones ha de ser entre 1 i 30.';err.hidden=false;$('f-pax').focus();return;}
    var r={id:'r'+(++S.seq),day:$('f-day').value,h:$('f-h').value,name:name,pax:pax,local:$('f-loc').value,zona:$('f-z').value,origin:$('f-o').value,estat:'Confirmada',nota:$('f-n').value.trim()};
    S.res.push(r); S.day=r.day; if(S.local!=='tots'&&S.local!==r.local) S.local=r.local;
    $('ov').hidden=true; S.view='res'; render(); toast('Reserva afegida: '+r.name+', '+r.h);
  }

  var h0=(location.hash||'').slice(1); if(V[h0]) S.view=h0;
  render();
})();
</script>

</body>
</html>

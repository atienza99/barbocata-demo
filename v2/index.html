html,body{height:100%}
body{margin:0;background:var(--night);color:#f4eee3;font:15px/1.5 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

#stage{position:fixed;inset:0;transition:right .6s cubic-bezier(.65,.05,.2,1),bottom .6s cubic-bezier(.65,.05,.2,1)}
#stage svg{width:100%;height:100%;display:block;touch-action:manipulation}
.panel-open #stage{right:420px}
@media (max-width:760px){ .panel-open #stage{right:0;bottom:52vh} }

/* Marcadors de zona dins del dibuix */
.pin{cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.inside .pin{opacity:1;pointer-events:auto}
.pin rect{fill:#1b1f2e;stroke:#f2b25a;stroke-width:2}
.pin text{font:700 22px var(--f-ui);fill:#fff}
.pin circle{fill:#f2b25a}
.pin:hover rect,.pin.on rect{fill:var(--red);stroke:#fff}
.scene .pin{opacity:0;pointer-events:none}
.hot{cursor:pointer}

/* Barra superior */
.topbar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:block;width:92px;aspect-ratio:1.57;background:var(--logo) center/84% no-repeat,#f7f4ec;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ghost{border:2px solid #f7f4ec;background:#1b1f2e;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
.ghost:hover{background:var(--red)}
.ghost[hidden]{display:none}

.dock{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);display:flex;gap:4px;padding:5px;z-index:5;
  border:2px solid #f7f4ec;border-radius:999px;background:#1b1f2e;max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none;transition:opacity .3s, left .6s cubic-bezier(.65,.05,.2,1)}
.dock::-webkit-scrollbar{display:none}
.dock button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;color:#cfd2dc}
.dock button[aria-pressed="true"]{background:var(--red);color:#fff;font-weight:700}
.outside .dock,.scene .dock{opacity:0;pointer-events:none}
.panel-open .dock{left:calc(50% - 210px)}
@media (max-width:760px){ .panel-open .dock{opacity:0;pointer-events:none} }

/* Portada */
#intro{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4;text-align:center;padding:0 16px;transition:opacity .4s}
#intro h1{margin:0;font:400 clamp(30px,5.4vw,54px)/1 var(--f-brand);color:#fff;text-shadow:0 3px 0 var(--red),0 6px 18px rgba(0,0,0,.5);text-wrap:balance}
#intro p{margin:0;color:#d7dae4;font-size:14px}
.cta{border:0;border-radius:999px;background:var(--red);color:#fff;font:400 19px/1 var(--f-brand);padding:14px 26px;cursor:pointer;box-shadow:0 5px 0 var(--red-dk),0 10px 26px rgba(214,16,46,.45);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 var(--red-dk)}
.inside #intro{opacity:0;pointer-events:none}

/* Panell */
#panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;z-index:6;background:var(--paper);color:var(--ink);transform:translateX(102%);
  transition:transform .6s cubic-bezier(.65,.05,.2,1);display:flex;flex-direction:column;box-shadow:-18px 0 40px -10px rgba(0,0,0,.5);color-scheme:light;font-family:var(--f-ui)}
.panel-open #panel{transform:none}
.p-scroll{overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 26px 26px;display:flex;flex-direction:column;gap:18px}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.p-logo{display:block;width:140px;aspect-ratio:1.57;background:var(--logo) left center/contain no-repeat;margin-bottom:4px}
.kicker{font:700 11px/1.3 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
#panel h2{font:400 40px/1 var(--f-brand);color:var(--red);margin:6px 0 0;text-wrap:balance}
#panel p{margin:0;color:#4a423d;font-size:15px;line-height:1.55;max-width:60ch}
.close{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1;color:var(--ink)}
.close:hover{border-color:var(--red);color:var(--red)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-size:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px}
.facts dt{color:var(--mute)} .facts dd{margin:0;font-weight:500}
.menu h3{font:400 18px/1 var(--f-brand);color:var(--ink);margin:0 0 6px}
.menu ul{list-style:none;margin:0;padding:0}
.menu li{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.menu li i{flex:1;border-bottom:1px dotted #cfc7bb;transform:translateY(-4px)}
.menu li b{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
#panel .cta{font-size:18px;padding:13px 22px;align-self:flex-start}
.walk{display:flex;gap:10px;margin-top:auto;padding-top:6px}
.walk button{flex:1;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);font-weight:500}
.walk button:last-child{text-align:right}
.walk button small{display:block;font:700 10px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.walk button:hover{border-color:var(--red);color:var(--red)}
.walk button[hidden]{display:none}
form.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}
form.res label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mute);font-weight:500}
form.res input,form.res select{background:var(--paper);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 10px;font:inherit;font-size:14px;min-width:0}
form.res .full{grid-column:1/-1}
form.res .cta{justify-self:stretch;text-align:center}
.note{font-size:12px;line-height:1.45;color:var(--mute)}
.ok{grid-column:1/-1;padding:12px;border-radius:10px;background:#fdecef;border:1px solid #f5b9c4;font-size:14px}
.ko{grid-column:1/-1;padding:10px 12px;border-radius:10px;background:#fff3e0;border:1px solid #f3c58a;color:#5a3a12;font-size:14px}
@media (max-width:760px){
  #panel{top:auto;left:0;width:auto;height:52vh;border-radius:20px 20px 0 0;transform:translateY(102%);box-shadow:0 -14px 34px -8px rgba(0,0,0,.5)}
  #panel h2{font-size:32px}
  .p-scroll{padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
  .brand{width:76px}
}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
#confetti i{position:absolute;top:-24px;display:block;border-radius:2px;will-change:transform;animation:fall var(--t) cubic-bezier(.25,.4,.5,1) var(--d) forwards}
@keyframes fall{to{transform:translate3d(var(--x),112vh,0) rotate(var(--r))}}
.tag{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:4;font:700 10px/1 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:#f2b25a;border:1px solid rgba(242,178,90,.4);border-radius:4px;padding:5px 7px;background:#141a2b}
.inside .tag{display:none}
@media (prefers-reduced-motion:reduce){ *{transition-duration:.01s!important} #confetti{display:none} }
</style>

const O = 'stroke="#2a1712" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"';   // traç de dibuix animat

/* ================= DIBUIX ================= */
const stool = (x, y = 600) => `<g transform="translate(${x},${y})">
  <path d="M-11 0 L-7 -52 M11 0 L7 -52 M-9 -18 H9" ${O} fill="none"/>
  <ellipse cx="0" cy="-56" rx="17" ry="7" fill="#26262b" ${O}/></g>`;
const lowStool = (x, y) => `<g transform="translate(${x},${y})">
  <path d="M-9 0 L-6 -34 M9 0 L6 -34" ${O} fill="none"/><ellipse cx="0" cy="-37" rx="15" ry="6" fill="#26262b" ${O}/></g>`;
const roundTable = (x, y = 600, r = 34) => `<g transform="translate(${x},${y})">
  <path d="M0 -70 V-4 M-16 -2 H16" ${O} fill="none"/>
  <ellipse cx="0" cy="-72" rx="${r}" ry="9" fill="#f6f4ef" ${O}/>
  <ellipse cx="-8" cy="-74" rx="8" ry="2.5" fill="#fff"/><path d="M${-r + 8} -70 q${r} 6 ${2 * r - 16} -2" stroke="#c9c4ba" stroke-width="2" fill="none"/></g>`;
const sconce = (x, y) => `<g transform="translate(${x},${y})"><circle r="40" fill="url(#glow)"/><path d="M-14 0 H-4" ${O}/><circle cx="6" r="11" fill="#fff6dc" ${O}/></g>`;

function person(id, o){   // personatge estil dibuix animat (cap gran, ulls expressius, ombrejat suau)
  // o: {x,y,h, shirt, shirtDk, pants, pantsDk, shoe, sole, skin, skinDk, hair, hairHi, iris, style:'barman'|'porter', sleeve}
  const H = o.h, R = H * .105, headCY = -(H - R * 1.12), neckY = headCY + R * .95, torsoTop = neckY + R * .28;
  const torsoH = H * .34, hipY = torsoTop + torsoH - 4, legH = -hipY, shY = torsoTop + R * .45, L = H * .34, tw = H * .3;
  const S = 'stroke="#3a2418" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"';
  const g = (n) => `${id}-${n}`;
  const defs = `<defs>
    <radialGradient id="${g('skin')}" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="${o.skinHi || o.skin}"/><stop offset=".65" stop-color="${o.skin}"/><stop offset="1" stop-color="${o.skinDk}"/></radialGradient>
    <linearGradient id="${g('shirt')}" x1="0" y1="0" x2="1" y2=".3"><stop offset="0" stop-color="${o.shirtHi || o.shirt}"/><stop offset=".55" stop-color="${o.shirt}"/><stop offset="1" stop-color="${o.shirtDk}"/></linearGradient>
    <linearGradient id="${g('pants')}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${o.pants}"/><stop offset="1" stop-color="${o.pantsDk}"/></linearGradient>
    <linearGradient id="${g('hair')}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.hairHi}"/><stop offset="1" stop-color="${o.hair}"/></linearGradient>
  </defs>`;
  const leg = side => { const lx = side * tw * .2;
    return `<g class="leg" data-ox="${lx}" data-oy="${hipY}">
      <path d="M${lx - H * .05} ${hipY - 4} Q${lx - H * .052} ${-legH * .45} ${lx - H * .042} -14 H${lx + H * .042} Q${lx + H * .052} ${-legH * .45} ${lx + H * .05} ${hipY - 4}Z" fill="url(#${g('pants')})" ${S}/>
      <path d="M${lx - H * .06} -4 Q${lx - H * .062} -20 ${lx - H * .03} -20 H${lx + H * .03} Q${lx + H * .075} -20 ${lx + H * .075} -4 Q${lx + H * .075} 3 ${lx + H * .06} 3 H${lx - H * .05} Q${lx - H * .062} 3 ${lx - H * .06} -4Z" fill="${o.shoe}" ${S}/>
      <path d="M${lx - H * .058} -1 H${lx + H * .072}" stroke="${o.sole}" stroke-width="4" stroke-linecap="round"/></g>`; };
  const arm = side => { const sx = side * tw * .44, sleeveL = o.sleeve ? L * .92 : L * .38;
    return `<g class="arm" data-side="${side}" data-ox="${sx}" data-oy="${shY}">
      <rect x="${sx - H * .036}" y="${shY - 6}" width="${H * .072}" height="${L}" rx="${H * .036}" fill="url(#${g('skin')})" ${S}/>
      <rect x="${sx - H * .042}" y="${shY - 8}" width="${H * .084}" height="${sleeveL}" rx="${H * .04}" fill="url(#${g('shirt')})" ${S}/>
      <g transform="translate(${sx},${shY + L})"><ellipse rx="${H * .04}" ry="${H * .046}" fill="url(#${g('skin')})" ${S}/><path d="M${-side * H * .036} ${-H * .01} q${-side * H * .022} ${-H * .005} ${-side * H * .018} ${H * .028}" fill="none" ${S} stroke-width="2"/></g></g>`; };
  const eye = (ex) => `<g class="eye" data-cy="${-R * .02}"><ellipse cx="${ex}" cy="${-R * .02}" rx="${R * .21}" ry="${R * .25}" fill="#fff" ${S} stroke-width="1.6"/>
      <circle cx="${ex + R * .03}" cy="${R * .02}" r="${R * .14}" fill="${o.iris}"/><circle cx="${ex + R * .03}" cy="${R * .02}" r="${R * .075}" fill="#140c08"/>
      <circle cx="${ex + R * .08}" cy="${-R * .05}" r="${R * .04}" fill="#fff"/>
      <path d="M${ex - R * .22} ${-R * .14} Q${ex} ${-R * .32} ${ex + R * .22} ${-R * .14}" fill="none" stroke="#3a2418" stroke-width="2.6"/></g>`;
  const hair = o.style === 'barman'
    ? `<path d="M${-R * 1.02} ${-R * .05} Q${-R * 1.12} ${-R * .95} ${-R * .35} ${-R * 1.22} Q${R * .3} ${-R * 1.45} ${R * .9} ${-R * 1.05} Q${R * 1.18} ${-R * .6} ${R * 1.02} ${-R * .05} Q${R * .92} ${-R * .52} ${R * .5} ${-R * .62} Q${R * .1} ${-R * .78} ${-R * .3} ${-R * .62} Q${-R * .75} ${-R * .52} ${-R * 1.02} ${-R * .05}Z" fill="url(#${g('hair')})" ${S}/>
       <path d="M${-R * .45} ${-R * 1.02} Q${R * .1} ${-R * 1.25} ${R * .65} ${-R * .95}" fill="none" stroke="${o.hairHi}" stroke-width="3" opacity=".7"/>`
    : `<path d="M${-R * 1.04} ${R * .05} Q${-R * 1.15} ${-R * .9} ${-R * .3} ${-R * 1.2} Q${R * .55} ${-R * 1.38} ${R * 1.02} ${-R * .7} Q${R * 1.12} ${-R * .3} ${R * 1.02} ${R * .05} Q${R * .9} ${-R * .48} ${R * .62} ${-R * .52} Q${R * .1} ${-R * .48} ${-R * .48} ${-R * .72} Q${-R * .7} ${-R * .4} ${-R * 1.04} ${R * .05}Z" fill="url(#${g('hair')})" ${S}/>
       <path d="M${-R * .7} ${-R * .95} Q${-R * .05} ${-R * 1.2} ${R * .7} ${-R * .82}" fill="none" stroke="${o.hairHi}" stroke-width="3" opacity=".7"/>`;
  const stubble = o.style === 'porter'
    ? `<path d="M${-R * .92} ${R * .15} Q${-R * .9} ${R * .95} 0 ${R * 1.08} Q${R * .9} ${R * .95} ${R * .92} ${R * .15} Q${R * .6} ${R * .58} 0 ${R * .5} Q${-R * .6} ${R * .58} ${-R * .92} ${R * .15}Z" fill="${o.hair}" opacity=".32"/>`
    : '';
  const mustache = o.style === 'barman'
    ? `<path d="M${-R * .34} ${R * .44} Q0 ${R * .32} ${R * .34} ${R * .44}" fill="none" stroke="${o.hair}" stroke-width="${R * .09}" stroke-linecap="round"/>` : '';
  return `<g id="${id}" transform="translate(${o.x},${o.y})">${defs}
    <ellipse cx="0" cy="3" rx="${H * .17}" ry="7" fill="rgba(0,0,0,.3)"/>
    <g class="body">
      ${leg(-1)}${leg(1)}
      ${arm(-1)}
      <path d="M${-tw / 2} ${torsoTop + H * .05} Q${-tw / 2} ${torsoTop} ${-tw / 2 + H * .05} ${torsoTop} H${tw / 2 - H * .05} Q${tw / 2} ${torsoTop} ${tw / 2} ${torsoTop + H * .05} L${tw / 2 - H * .02} ${hipY + 6} H${-tw / 2 + H * .02}Z" fill="url(#${g('shirt')})" ${S}/>
      <path d="M${-R * .45} ${torsoTop + 1} Q0 ${torsoTop + R * .55} ${R * .45} ${torsoTop + 1}" fill="url(#${g('skin')})" ${S} stroke-width="1.8"/>
      ${arm(1)}
      <rect x="${-R * .3}" y="${neckY - R * .2}" width="${R * .6}" height="${R * .5}" fill="${o.skinDk}"/>
      <g class="head" transform="translate(0,${headCY})">
        <circle cx="${-R * .98}" cy="${R * .08}" r="${R * .22}" fill="url(#${g('skin')})" ${S}/><circle cx="${R * .98}" cy="${R * .08}" r="${R * .22}" fill="url(#${g('skin')})" ${S}/>
        <ellipse rx="${R}" ry="${R * 1.1}" fill="url(#${g('skin')})" ${S}/>
        ${stubble}
        <circle cx="${-R * .55}" cy="${R * .35}" r="${R * .16}" fill="#e98a7a" opacity=".35"/><circle cx="${R * .55}" cy="${R * .35}" r="${R * .16}" fill="#e98a7a" opacity=".35"/>
        <path d="M${-R * .06} ${R * .08} Q${-R * .16} ${R * .3} ${-R * .02} ${R * .34} Q${R * .1} ${R * .36} ${R * .12} ${R * .28}" fill="none" stroke="${o.skinDk}" stroke-width="2.4" stroke-linecap="round"/>
        ${hair}
        <g class="happy">
          <path d="M${-R * .62} ${-R * .36} Q${-R * .38} ${-R * .52} ${-R * .14} ${-R * .38}" fill="none" stroke="${o.hair}" stroke-width="${R * .12}" stroke-linecap="round"/>
          <path d="M${R * .14} ${-R * .38} Q${R * .38} ${-R * .52} ${R * .62} ${-R * .36}" fill="none" stroke="${o.hair}" stroke-width="${R * .12}" stroke-linecap="round"/>
          ${eye(-R * .37)}${eye(R * .37)}
          <path d="M${-R * .42} ${R * .5} Q0 ${R * .54} ${R * .42} ${R * .5} Q${R * .3} ${R * .9} 0 ${R * .9} Q${-R * .3} ${R * .9} ${-R * .42} ${R * .5}Z" fill="#7a2a22" ${S} stroke-width="2"/>
          <path d="M${-R * .36} ${R * .53} Q0 ${R * .58} ${R * .36} ${R * .53} L${R * .3} ${R * .64} Q0 ${R * .67} ${-R * .3} ${R * .64}Z" fill="#fff"/>
        </g>

const anims = new Set(); let rafOn = false;
function tick(now){ anims.forEach(a => { if (a(now) === false) anims.delete(a); }); if (anims.size) requestAnimationFrame(tick); else rafOn = false; }
function run(fn){ anims.add(fn); if (!rafOn) { rafOn = true; requestAnimationFrame(tick); } return () => anims.delete(fn); }
function tween(ms, step, done){ const t0 = performance.now(); return run(now => { const p = Math.min(1, (now - t0) / ms); step(p); if (p >= 1) { done && done(); return false; } }); }
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function applyCam(){
  const el = W, w = el.clientWidth || innerWidth, h = el.clientHeight || innerHeight, a = w / h;
  let [x, y, cw, ch] = cam;
  if (cw / ch < a) { const nw = ch * a; x -= (nw - cw) / 2; cw = nw; } else { const nh = cw / a; y -= (nh - ch) / 2; ch = nh; }
  el.setAttribute('viewBox', `${x} ${y} ${cw} ${ch}`);
}
function camTo(name, ms = 1100){
  const from = cam.slice(), to = SHOTS[name];
  camStop && camStop();
  if (reduce) ms = 1;
  camStop = tween(ms, p => { const k = ease(p); cam = from.map((v, i) => v + (to[i] - v) * k); applyCam(); });
}
new ResizeObserver(() => applyCam()).observe(W);

const rot = (el, deg) => el.setAttribute('transform', `rotate(${deg} ${el.dataset.ox} ${el.dataset.oy})`);
const barman = $('#barman'), runner = $('#runner');
const parts = g => ({ arms: [...g.querySelectorAll('.arm')], legs: [...g.querySelectorAll('.leg')], happy: g.querySelector('.happy'), sad: g.querySelector('.sad'), tears: [...g.querySelectorAll('.tear')], body: g.querySelector('.body') });
const PB = parts(barman), PR = parts(runner);
function restPose(P){ P.arms.forEach(a => rot(a, a.dataset.side * 8)); P.legs.forEach(l => l.removeAttribute('transform')); P.body.removeAttribute('transform'); P.happy.removeAttribute('display'); P.sad.setAttribute('display', 'none'); }
restPose(PB); restPose(PR);

// detalls vius: parpelleig, vapor i estrelles
run(now => {
  const blink = (now % 3800) < 140;
  [PB, PR].forEach(P => P.happy.querySelectorAll('.eye').forEach(e => e.setAttribute('transform', blink ? `translate(0 ${e.dataset.cy * .9}) scale(1 .1)` : '')));
  const st = $('#steam'); st.setAttribute('transform', `translate(0 ${-(now / 40) % 26})`); st.setAttribute('opacity', .55 - ((now / 40) % 26) / 50);
});

let stopFx = () => {};
function clap(ms){
  const t0 = performance.now(); let on = true;
  const stop = run(now => { if (!on) return false; const t = (now - t0) / 1000;
    const up = Math.min(1, t / .35), osc = t > .35 ? (Math.sin((t - .35) * Math.PI / .16) * .5 + .5) : 0;
    [PB, PR].forEach(P => P.arms.forEach(a => rot(a, -a.dataset.side * (8 + up * 150 + osc * 14))));
    [PB, PR].forEach(P => P.body.setAttribute('transform', `translate(0 ${-Math.abs(Math.sin(t * 9)) * 6 * up})`));
    if (t * 1000 >= ms) { restPose(PB); restPose(PR); return false; } });
  return () => { on = false; stop(); restPose(PB); restPose(PR); };
}
function cry(ms){
  PB.happy.setAttribute('display', 'none'); PB.sad.removeAttribute('display');
  const t0 = performance.now(); let on = true;
  const stop = run(now => { if (!on) return false; const t = (now - t0) / 1000;
    PB.tears.forEach((el, i) => { const ph = ((t + (i % 2) * .25 + (i > 1 ? .45 : 0)) % .9) / .9; el.setAttribute('transform', `translate(0 ${ph * 34})`); el.setAttribute('opacity', 1 - ph); });
    PB.body.setAttribute('transform', `translate(0 ${Math.abs(Math.sin(t * 14)) * 3})`);
    PB.arms.forEach(a => rot(a, -a.dataset.side * (128 + Math.sin(t * 14) * 5)));   // mans a la cara
    if (t * 1000 >= ms) { restPose(PB); return false; } });
  return () => { on = false; stop(); restPose(PB); };
}
const RX = 1360, DOOR2 = 1920;
function runAway(){
  const t0 = performance.now(), T = 3400;
  return new Promise(res => run(now => {
    const p = Math.min(1, (now - t0) / T), t = (now - t0) / 1000;
    let x = RX, op = 1, lean = 0, sw = 0, fx = 1;
    if (p < .08) { lean = 6 * p / .08; }
    else if (p < .78) { const k = (p - .08) / .70; x = RX + (DOOR2 - RX) * k; lean = 8; sw = Math.sin(t * Math.PI * 5) * 34; }
    else { x = DOOR2; fx = 1 - (p - .78) / .22 * .25; op = Math.max(0, 1 - (p - .78) / .2); }
    const bob = sw ? -Math.abs(Math.sin(t * Math.PI * 5)) * 8 : 0;
    runner.setAttribute('transform', `translate(${x},${604 + bob}) scale(${fx})`);
    PR.body.setAttribute('transform', `rotate(${lean} 0 -100)`);
    PR.legs[0].setAttribute('transform', `rotate(${sw} ${PR.legs[0].dataset.ox} ${PR.legs[0].dataset.oy})`);
    PR.legs[1].setAttribute('transform', `rotate(${-sw} ${PR.legs[1].dataset.ox} ${PR.legs[1].dataset.oy})`);
    rot(PR.arms[0], 8 - sw); rot(PR.arms[1], -8 - sw);
    runner.setAttribute('opacity', op);
    $('#bb2door').setAttribute('opacity', p > .7 ? Math.min(.85, (p - .7) * 5) * (p > .97 ? 0 : 1) : 0);
    if (p >= 1) { res(); return false; }
  }));
}
function resetRunner(){ runner.setAttribute('transform', `translate(${RX},604)`); runner.setAttribute('opacity', 1); restPose(PR); $('#bb2door').setAttribute('opacity', 0); }

/* ================= FAÇANA ================= */
const facade = $('#facade'), leafL = $('#leafL'), leafR = $('#leafR');
let inside = false, busy = false;
function setDoors(k){   // k: 0 tancades → 1 obertes (s'apleguen cap a la bisagra)
  leafL.setAttribute('transform', `translate(${666 * k} 0) scale(${1 - k * .85} 1)`);
  leafR.setAttribute('transform', `translate(${834 * k} 0) scale(${1 - k * .85} 1)`);
}
function enter(){
  if (inside || busy) return; busy = true;
  tween(reduce ? 1 : 600, p => setDoors(ease(p)), () => {
    camTo('entrada', 1300);
    tween(reduce ? 1 : 700, p => facade.setAttribute('opacity', 1 - p), () => { facade.setAttribute('display', 'none'); busy = false; });
    inside = true; document.body.classList.add('inside'); document.body.classList.remove('outside');
    $('#toStreet').hidden = false;
    setTimeout(() => go('entrada', {noCam: true}), 500);
  });
}
function toStreet(){
  stopAll(); closePanel();
  facade.removeAttribute('display');
  tween(500, p => facade.setAttribute('opacity', p), () => setDoors(0));
  inside = false; document.body.classList.remove('inside'); document.body.classList.add('outside');
  $('#toStreet').hidden = true; current = null;
  camTo('facade', 1100);
  dockSync();
}
document.body.classList.add('outside');

/* ================= NAVEGACIÓ I PANELL ================= */
let current = null;
const dockBtns = [...document.querySelectorAll('.dock [data-go]')];
function dockSync(){ dockBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.go === (current || ''))); document.querySelectorAll('.pin').forEach(p => p.classList.toggle('on', p.dataset.go === current)); }
function go(k, o = {}){
  if (!inside) return;
  current = k; dockSync();
  if (k === 'overview') { closePanel(); camTo('overview'); return; }
  openPanel(k);
  if (!o.noCam) camTo(k);
}
const pbody = $('#pbody');
function openPanel(k){
  const Z = ZONES[k], i = ORDER.indexOf(k), prev = ORDER[i - 1], next = ORDER[i + 1];
  pbody.innerHTML = `
    <div class="p-head"><div>${Z.logo ? '<span class="p-logo" role="img" aria-label="Logotip de Bar Bocata"></span>' : ''}<div class="kicker">${Z.kicker}</div><h2>${Z.title}</h2></div>
      <button class="close" type="button" aria-label="Tanca i torna a la vista general" data-go="overview">×</button></div>
    <p>${Z.text}</p>
    <dl class="facts">${Z.facts.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
    ${Z.menu ? `<div class="menu"><h3>El que es demana aquí</h3><ul>${Z.menu.map(([a, b]) => `<li><span>${a}</span><i></i><b>${b}</b></li>`).join('')}</ul></div>` : ''}
    ${Z.cta ? `<button class="cta" type="button" id="resBtn">${Z.cta}</button><div id="resSlot"></div>` : ''}
    <div class="walk">
      <button type="button" data-go="${prev || ''}" ${prev ? '' : 'hidden'}><small>Anterior</small>← ${prev ? ZONES[prev].label : ''}</button>
      <button type="button" data-go="${next || ''}" ${next ? '' : 'hidden'}><small>Següent</small>${next ? ZONES[next].label : ''} →</button>
    </div>`;
  document.body.classList.add('panel-open');
  const rb = $('#resBtn'); if (rb) rb.addEventListener('click', () => showForm(k));
}
function closePanel(){ document.body.classList.remove('panel-open'); }

/* ================= RESERVA ================= */
const FULL = ['21:00', '21:30'];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function showForm(k){
  const slot = $('#resSlot'); if (!slot || slot.firstChild) return;
  const tm = new Date(); tm.setDate(tm.getDate() + 1);
  const down = k === 'baix' || k === 'llarga';
  slot.innerHTML = `<form class="res" id="resForm">
    <label>Dia<input id="rDate" type="date" value="${ymd(tm)}" min="${ymd(new Date())}" required></label>
    <label>Hora<select id="rTime">${['13:00', '13:30', '14:00', '14:30', '20:00', '20:30', '21:00', '21:30', '22:00'].map(t => `<option value="${t}" ${t === '20:30' ? 'selected' : ''}>${t}${FULL.includes(t) ? ' · complet' : ''}</option>`).join('')}</select></label>
    <label>Persones<select id="rPax">${[1, 2, 3, 4, 5, 6].map(n => `<option ${n === 2 ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <label>Zona<select id="rZone"><option ${down ? '' : 'selected'}>Planta carrer</option><option ${down ? 'selected' : ''}>Sala de baix</option></select></label>
    <div id="resMsg" class="full" hidden></div>
    <button class="cta full" type="submit">Sol·licita la reserva</button>
    <p class="note full">Prototip: aquí es connectaria el motor de reserves del restaurant.</p></form>`;
  $('#resForm').addEventListener('submit', e => { e.preventDefault(); book(); });
}
const seq = [];
const later = (ms, fn) => seq.push(setTimeout(fn, reduce ? 0 : ms));
function stopAll(){ seq.splice(0).forEach(clearTimeout); stopFx(); stopFx = () => {}; resetRunner(); restPose(PB); document.body.classList.remove('scene'); }
const narrow = () => innerWidth < 760;

function book(){
  const t = $('#rTime').value, msg = $('#resMsg');
  stopAll(); msg.hidden = true;
  document.body.classList.add('scene');
  if (narrow()) closePanel();
  if (FULL.includes(t)) {
    // 1) primer pla del cambrer, que plora · 2) pla obert del carrer · 3) el porter marxa corrents al Bar Bocata 2
    camTo('face', 1000);
    later(800, () => { stopFx = cry(2800); });
    later(3700, () => camTo('run', 1100));
    later(4800, () => runAway().then(() => {
      msg.className = 'ko full'; msg.hidden = false;
      msg.innerHTML = `Ho sentim, a les <b>${t}</b> no queda cap taula lliure al Bar Bocata. Prova una altra hora o passa pel Bar Bocata 2, aquí al costat.`;
      document.body.classList.remove('scene');
      if (narrow()) document.body.classList.add('panel-open');
    }));
  } else {
    camTo('both', 900);
    later(700, () => { stopFx = clap(3800); confetti(); });
    later(900, () => {
      const d = new Date($('#rDate').value + 'T12:00').toLocaleDateString('ca-ES', { weekday: 'long', day: 'numeric', month: 'long' });
      msg.className = 'ok full'; msg.hidden = false;
      msg.innerHTML = `Taula per a <b>${$('#rPax').value}</b> a la <b>${$('#rZone').value.toLowerCase()}</b>, ${d} a les <b>${t}</b>.<br><span class="note">A la versió real, aquí arribaria la confirmació.</span>`;
    });
    later(4700, () => { document.body.classList.remove('scene'); if (narrow()) document.body.classList.add('panel-open'); });
  }
}
function confetti(){
  if (reduce) return;
  let layer = $('#confetti'); if (!layer) { layer = document.createElement('div'); layer.id = 'confetti'; layer.setAttribute('aria-hidden', 'true'); document.body.appendChild(layer); }
  const cols = ['#d6102e', '#004d98', '#a50044', '#f6c800', '#ffffff', '#00823e'], frag = document.createDocumentFragment(), n = narrow() ? 70 : 120;
  for (let i = 0; i < n; i++) { const p = document.createElement('i'), w = 6 + Math.random() * 7;
    p.style.cssText = `left:${Math.random() * 100}%;width:${w}px;height:${w * (.4 + Math.random() * .6)}px;background:${cols[i % cols.length]};--x:${(Math.random() - .5) * 220}px;--r:${(Math.random() - .5) * 1440}deg;--t:${2.4 + Math.random() * 1.8}s;--d:${Math.random() * .9}s`;
    frag.appendChild(p); }
  layer.appendChild(frag); setTimeout(() => layer.replaceChildren(), 5400);
}

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (t && t.dataset.go) { if (document.body.classList.contains('scene')) return; go(t.dataset.go); return; }
  if (e.target.closest('#doorHit')) enter();
});
$('#enter').addEventListener('click', enter);
$('#toStreet').addEventListener('click', toStreet);
addEventListener('keydown', e => {
  if (!inside || /INPUT|SELECT/.test(document.activeElement.tagName) || document.body.classList.contains('scene')) return;
  const i = ORDER.indexOf(current);
  if (e.key === 'Escape') go('overview');
  if (e.key === 'ArrowRight') go(ORDER[Math.min(ORDER.length - 1, i + 1)]);
  if (e.key === 'ArrowLeft') go(i <= 0 ? 'overview' : ORDER[i - 1]);
});
dockSync();
})();
</script>

</html>
